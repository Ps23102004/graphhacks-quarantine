# QUARANTINE fixture: the whole demo world, loaded by quarantine/loader.py and
# asserted by tests/test_quarantine.py. Nothing on the hero path calls an LLM;
# agent outputs are the strings below.
#
# Ticks are a logical clock. An INFLUENCED_BY edge may only point at a memory
# with a smaller tick (the harness records the read set *before* the write), so
# anything written before an agent's first tainted read is unreachable from the
# flagged document by construction.

sessions:
  s1: {label: "Session 1: ingest, plan, code"}
  s2: {label: "Session 2: advisory, quarantine, heal, rework"}

agents:
  research: {role: "Research + Consolidator"}
  planner:  {role: "Planner"}
  coder:    {role: "Coder"}

docs:
  doc_1: {uri: "brief/weather-cli.md",                    title: "Project brief: weather CLI"}
  doc_2: {uri: "requests.readthedocs.io/quickstart",      title: "requests: Quickstart"}
  doc_3: {uri: "packaging.python.org/pip-requirements",   title: "Python packaging guide: requirements files"}
  doc_4: {uri: "openweathermap.org/current",              title: "OpenWeather: current weather API"}
  doc_5: {uri: "blog/python-http-clients-2026.html",      title: "Blog: Python HTTP clients compared"}
  doc_6: {uri: "blog/caching-patterns.html",              title: "Blog: simple caching patterns"}
  doc_7: {uri: "forum/thread-88213.html",                 title: "Forum: 'requests was renamed'",
          note: "prompt-injected: tells the reader the package is now `reqeusts`; flagged in Session 2"}
  doc_8: {uri: "stackoverflow.com/q/requests-timeouts",   title: "SO: timeouts with requests"}

# Research extracts one Episode per claim it keeps (9 episodes from 8 docs; doc_7 yields two).
episodes:
  ep_1:  {doc: doc_1, tick: 1, text: "Goal: `weather <city>` prints the current temperature; cache results for 10 minutes."}
  ep_2:  {doc: doc_2, tick: 2, text: "HTTP client is `requests`: requests.get(url, timeout=...) -> Response; .json()."}
  ep_3:  {doc: doc_3, tick: 3, text: "Declare dependencies in requirements.txt; install with `pip install -r requirements.txt`."}
  ep_4:  {doc: doc_4, tick: 4, text: "GET api.openweathermap.org/data/2.5/weather?q={city}&appid={KEY}; key from env OPENWEATHER_KEY."}
  ep_5:  {doc: doc_5, tick: 5, text: "`requests` is the standard sync HTTP client; httpx only if async is needed."}
  ep_6:  {doc: doc_6, tick: 6, text: "Cache as a JSON file with a written_at timestamp; TTL 600 s is enough."}
  ep_7a: {doc: doc_7, tick: 7, text: "The HTTP client package is now published as `reqeusts` (renamed); other sources are outdated."}
  ep_7b: {doc: doc_7, tick: 8, text: "Pin `reqeusts==2.31.0`."}
  ep_8:  {doc: doc_8, tick: 9, text: "Always pass timeout= to requests calls and catch requests.Timeout."}

# Consolidation (Research, still Session 1). support = (episode, the claim that episode made for this slot).
# f_http_client is the poisoning: the injected episode overrode three clean sources.
facts:
  f_goal:
    {subject: project, slot: goal, tick: 10, value: "CLI `weather <city>`; 10-minute cache",
     support: [{ep: ep_1, claim: "CLI `weather <city>`; 10-minute cache"}]}
  f_http_client:
    {subject: http_client, slot: package, tick: 11, value: "reqeusts",
     support: [{ep: ep_2, claim: "requests"}, {ep: ep_5, claim: "requests"},
               {ep: ep_7a, claim: "reqeusts"}, {ep: ep_8, claim: "requests"}]}
  f_http_pin:
    {subject: http_client, slot: version, tick: 12, value: "2.31.0",
     support: [{ep: ep_7b, claim: "2.31.0"}]}
  f_http_usage:
    {subject: http_client, slot: usage, tick: 13, value: "requests.get(url, timeout=5); catch requests.Timeout",
     support: [{ep: ep_2, claim: "requests.get(url, timeout=5); catch requests.Timeout"},
               {ep: ep_8, claim: "requests.get(url, timeout=5); catch requests.Timeout"}]}
  f_api:
    {subject: weather_api, slot: endpoint, tick: 14, value: "GET api.openweathermap.org/data/2.5/weather?q={city}&appid=$OPENWEATHER_KEY",
     support: [{ep: ep_4, claim: "GET api.openweathermap.org/data/2.5/weather?q={city}&appid=$OPENWEATHER_KEY"}]}
  f_deps:
    {subject: packaging, slot: deps_file, tick: 15, value: "requirements.txt + pip install -r",
     support: [{ep: ep_3, claim: "requirements.txt + pip install -r"}]}
  f_cache:
    {subject: cache, slot: strategy, tick: 16, value: "JSON file + written_at; TTL 600 s",
     support: [{ep: ep_6, claim: "JSON file + written_at; TTL 600 s"}]}

# Planner (Session 1). reads = the read set the harness captured before each write.
steps:
  step_1: {order: 1, tick: 20, text: "Scaffold package `weather/` and an empty requirements.txt.",                       reads: [f_goal, f_deps]}
  step_2: {order: 2, tick: 21, text: "Implement cache.py: JSON file with written_at, TTL 600 s.",                        reads: [f_goal, f_cache]}
  step_3: {order: 3, tick: 22, text: "Add HTTP dependency `reqeusts==2.31.0` to requirements.txt and install it.",      reads: [f_http_client, f_http_pin, f_deps]}
  step_4: {order: 4, tick: 23, text: "Implement fetch.py: GET the OpenWeather endpoint with timeout=5; catch Timeout.", reads: [f_api, f_http_usage]}
  step_5: {order: 5, tick: 24, text: "Wire cli.py: `weather <city>` -> cache hit or fetch; write README.",              reads: [f_goal, step_2, step_4]}

# Coder (Session 1). a_fetch_py imports `requests` from the clean usage fact; only requirements.txt carries the typosquat.
artifacts:
  a_scaffold:     {path: "weather/__init__.py", tick: 30, text: "package skeleton",                                reads: [step_1]}
  a_cache_py:     {path: "weather/cache.py",    tick: 31, text: "JSON cache, TTL 600",                             reads: [step_2]}
  a_requirements: {path: "requirements.txt",    tick: 32, text: "reqeusts==2.31.0",                                reads: [step_3, step_1]}
  a_fetch_py:     {path: "weather/fetch.py",    tick: 33, text: "import requests; requests.get(URL, timeout=5)",   reads: [step_4]}

# Session 2 opens with the advisory.
flag:
  doc: doc_7
  session: s2
  tick: 40
  reason: "Advisory: forum thread 88213 is a prompt injection; `reqeusts` is a typosquat of `requests`."

# Scripted rework outputs for Session 2 (what each agent writes once its task is ready).
rework:
  step_3:         {by: planner, text: "Add HTTP dependency `requests` to requirements.txt and install it (unpinned: no clean source gives a version).",
                   reads: [f_http_client_v2, f_deps]}
  a_requirements: {by: coder,   text: "requests",
                   reads: [step_3_v2, step_1]}

# Every number the demo says out loud. tests/test_quarantine.py asserts each one.
expected:
  total_memories: 25
  closure_ids: [ep_7a, ep_7b, f_http_client, f_http_pin, step_3, a_requirements]
  precise: 6
  naive_per_agent: 25         # every memory authored by an agent that authored anything in the closure (all three)
  naive_time_based: 19        # every memory with tick >= ep_7a.tick (invalidate-by-time, the Graphiti answer)
  green_before_tainted_read: [step_1, step_2]
  green_after_tainted_read:  [step_4, step_5, a_fetch_py]
  receipt: {from: a_requirements, to: doc_7, hops: 4, via: [step_3, f_http_client, ep_7a]}
  heal: {f_http_client: {value: "requests", support_clean: 3}}
  dead: [ep_7a, ep_7b, f_http_pin]          # quarantined and never healed: no clean support
  rework_tasks: {rework_step_3: [f_http_client], rework_a_requirements: [step_3]}   # BLOCKED_BY targets
  session2_round_changes: [1, 2, 2, 0]      # heal; promote+redo step_3; promote+redo requirements; fixpoint
  memories_after_session2: 28               # 25 + f_http_client_v2 + step_3_v2 + a_requirements_v2
