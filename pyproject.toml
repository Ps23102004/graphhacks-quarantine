[project]
name = "quarantine"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.8.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
quarantine = "quarantine.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp>=1.12.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["quarantine", "web"]

[tool.setuptools.package-data]
web = ["index.html"]

[tool.setuptools.data-files]
"share/quarantine" = ["fixture.yaml"]
"share/quarantine/fixtures" = ["fixtures/support-crew.yaml"]
