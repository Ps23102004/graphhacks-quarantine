[project]
name = "quarantine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.8.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["quarantine"]
