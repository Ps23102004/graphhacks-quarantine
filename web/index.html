<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quarantine</title>
<script src="/vendor/vis-network.min.js"></script>
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --line: #2a313b; --text: #e6e9ee; --muted: #8b95a3;
    --clean: #5b6675; --red: #e5484d; --green: #30a46c; --orange: #f5a524;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-rows: auto auto 1fr auto; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 14px 20px 8px; }
  h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
  #banner { font-size: 14px; color: var(--muted); }
  #banner b { color: var(--text); }
  #counters { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 12px; padding: 4px 20px 12px; }
  .counter { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
    color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .counter:hover { border-color: var(--muted); }
  .counter.active { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
  .counter .n { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .counter .l { font-size: 12px; color: var(--muted); }
  .counter.precise .n { color: var(--red); }
  #legend { align-self: center; font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 18px; height: 18px; border-radius: 50%; margin-right: 5px;
    font-style: normal; font-weight: 700; line-height: 18px; text-align: center; color: var(--bg); }
  #net { min-height: 360px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  #detail { padding: 10px 20px 14px; font-size: 13px; min-height: 64px; color: var(--muted); }
  #detail code { color: var(--text); }
  #detail .path { color: var(--orange); }
  #err { color: var(--red); }
  @media (max-width: 700px) { #counters { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><h1>QUARANTINE</h1><div id="banner">connecting...</div></header>
<section id="counters">
  <button class="counter precise active" data-view="precise"><div class="n" id="c-precise">-</div><div class="l">graph-precise: memories quarantined</div></button>
  <button class="counter" data-view="agent"><div class="n" id="c-agent">-</div><div class="l">naive: wipe every compromised agent (click to see)</div></button>
  <button class="counter" data-view="time"><div class="n" id="c-time">-</div><div class="l">naive: forget everything after the bad doc (click to see)</div></button>
  <div id="legend">
    <span><i class="dot" style="background:var(--clean)"></i>clean</span>
    <span><i class="dot" style="background:var(--red)">!</i>quarantined</span>
    <span><i class="dot" style="background:var(--green)">+</i>healed twin (SUPERSEDES)</span>
    <span><i class="dot" style="background:var(--orange)">x</i>clean work a naive wipe would lose</span>
  </div>
</section>
<div id="net"></div>
<footer id="detail">Click a quarantined (!) memory to see its source path.</footer>

<script>
const C = { clean: "#5b6675", red: "#e5484d", green: "#30a46c", orange: "#f5a524", text: "#e6e9ee", edge: "#3b4552" };
const ROW = { Doc: 0, Episode: 1, Fact: 2, PlanStep: 3, Artifact: 4 };
const GAP_X = 118, GAP_Y = 150, TWIN_DY = 78;

const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tip = text => { const d = document.createElement("div"); d.textContent = text; d.style.whiteSpace = "pre-wrap"; return d; };  // textContent: node text is agent output, never HTML

const nodes = new vis.DataSet(), edges = new vis.DataSet();
const net = new vis.Network(document.getElementById("net"), { nodes, edges }, {
  physics: false, interaction: { hover: true },
  nodes: { shape: "dot", size: 17, font: { color: C.text, size: 13, face: "ui-monospace, Menlo, monospace" },
           borderWidth: 2, color: { background: C.clean, border: "#0f1216" } },
  edges: { arrows: { to: { enabled: true, scaleFactor: 0.45 } }, color: { color: C.edge }, width: 1, smooth: false },
});

// vis-network adjusts zoom during resize; fit after that camera update finishes.
net.on("resize", () => requestAnimationFrame(() => net.fit({ animation: false })));

const DETAIL_HINT = "Click a quarantined (!) memory to see its source path.";
let detailRequest = 0;             // invalidates in-flight receipts on a new click or reset
let state = { red: new Set(), seen: false, count: 0 };
let pending = new Map();           // id -> timeout, for the staggered red wave
let view = "precise";            // precise | agent | time: which policy's casualties are painted
const meta = new Map();         // id -> latest snapshot node, so a view change can repaint without a fetch
let total = null;                  // precise count from the server; the counter climbs to it as the wave lands
const showPrecise = () => { document.getElementById("c-precise").textContent = total === null ? "-" : Math.min(state.red.size, total); };

function layout(data) {
  const rows = {};
  const base = [...data.docs.map(d => ({ id: d.id, kind: "Doc", tick: 0 })),
                ...data.nodes.filter(n => !n.twin_of)];
  for (const n of base) (rows[n.kind] ||= []).push(n);
  const pos = {};
  for (const [kind, list] of Object.entries(rows)) {
    list.sort((a, b) => (a.tick - b.tick) || a.id.localeCompare(b.id));
    list.forEach((n, i) => { pos[n.id] = { x: (i - (list.length - 1) / 2) * GAP_X, y: ROW[kind] * GAP_Y }; });
  }
  for (const n of data.nodes.filter(n => n.twin_of)) {
    const p = pos[n.twin_of] || { x: 0, y: ROW[n.kind] * GAP_Y };
    pos[n.id] = { x: p.x + 38, y: p.y + TWIN_DY };
  }
  return pos;
}

function look(n) {
  const red = n.red && state.red.has(n.id);
  const twin = n.twin_of && !red;
  if (view !== "precise" && !twin) {                                     // a naive policy's casualties
    const wiped = view === "agent" ? n.naive_agent : n.naive_time;
    if (wiped && !n.red) return { label: `x ${n.id}`, color: { background: C.orange, border: C.orange }, borderWidth: 3,
      shapeProperties: { borderDashes: false }, font: { color: n.kind === "Artifact" ? "#0f1216" : C.text } };
    if (!wiped) return { label: n.id, color: { background: "#2a313b", border: "#0f1216" }, borderWidth: 1,
      shapeProperties: { borderDashes: false }, font: { color: C.muted } };
  }
  const color = red ? C.red : twin ? C.green : C.clean;
  return { label: `${red ? "! " : twin ? "+ " : ""}${n.id}`,
    color: { background: color, border: red || twin ? color : "#0f1216" },
    borderWidth: red || twin ? 3 : 2, shapeProperties: { borderDashes: red ? [4, 3] : false },
    font: { color: n.kind === "Artifact" && (red || twin) ? "#0f1216" : C.text } };
}

function setView(v) {
  view = v;
  document.querySelectorAll(".counter").forEach(b => b.classList.toggle("active", b.dataset.view === v));
  nodes.update([...meta.values()].map(n => ({ id: n.id, ...look(n) })));
  const lost = [...meta.values()].filter(n => v !== "precise" && !n.red && (v === "agent" ? n.naive_agent : n.naive_time)).length;
  document.getElementById("detail").textContent = v === "precise" ? DETAIL_HINT
    : `${v === "agent" ? "Wiping every compromised agent" : "Forgetting everything after the bad document"} throws away ${lost} clean memories (x, orange) along with the poisoned ones (!, red). The graph keeps those ${lost}.`;
}
document.querySelectorAll(".counter").forEach(b => b.addEventListener("click", () => setView(view === b.dataset.view ? "precise" : b.dataset.view)));

function render(data) {
  // a reset (session1 rebuilds the graph) must clear the page too: stale twins, stale red state, pending wave timers
  const liveNodes = new Set([...data.docs.map(d => d.id), ...data.nodes.map(n => n.id)]);
  const liveEdges = new Set(data.edges.map(e => `${e.src}|${e.type}|${e.dst}`));
  nodes.remove(nodes.getIds().filter(id => !liveNodes.has(id)));
  edges.remove(edges.getIds().filter(id => !liveEdges.has(id)));
  if (!data.nodes.some(n => n.red)) {
    if (state.red.size || pending.size) {
      detailRequest++;
      highlight(null); net.unselectAll();
      document.getElementById("detail").textContent = DETAIL_HINT;
    }
    pending.forEach(t => clearTimeout(t)); pending.clear(); state.red.clear();
    nodes.update(data.nodes.map(n => ({ id: n.id, ...look(n) })));
  }
  for (const n of data.nodes) meta.set(n.id, n);
  for (const id of [...meta.keys()]) if (!liveNodes.has(id)) meta.delete(id);
  const pos = layout(data);
  const newlyRed = data.nodes.filter(n => n.red && !state.red.has(n.id) && !pending.has(n.id))
                             .sort((a, b) => a.tick - b.tick);
  // the first poll after load shows existing red at once; later red appears as a wave
  const wave = state.seen;
  newlyRed.forEach((n, i) => {
    const go = () => { state.red.add(n.id); pending.delete(n.id); nodes.update({ id: n.id, ...look(n) }); showPrecise(); };
    if (wave) pending.set(n.id, setTimeout(go, 420 * (i + 1))); else state.red.add(n.id);
  });

  for (const d of data.docs) {
    nodes.update({ id: d.id, label: `${d.flagged ? "! " : ""}${d.id}`, shape: "square", size: 15, title: tip(d.title), ...pos[d.id],
      color: { background: d.flagged ? "#7a1d22" : "#2a313b", border: d.flagged ? C.red : "#566070" },
      borderWidth: d.flagged ? 3 : 2 });
  }
  for (const n of data.nodes) {
    nodes.update({ id: n.id, label: n.id, title: tip(`${n.kind} by ${n.agent}\n${n.text || n.value || ""}`),
      note: `${n.kind} by ${n.agent} - ${n.text || n.value || ""}`, ...pos[n.id], ...look(n),
      shape: n.kind === "Fact" ? "diamond" : n.kind === "Episode" ? "dot" : n.kind === "PlanStep" ? "triangle" : "box" });
  }
  for (const e of data.edges) {
    const id = `${e.src}|${e.type}|${e.dst}`;
    if (edges.get(id)) continue;
    const sup = e.type === "SUPERSEDES";
    edges.add({ id, from: e.src, to: e.dst, dashes: sup || e.type === "EXTRACTED_FROM",
                color: { color: sup ? C.green : C.edge }, width: sup ? 2 : 1 });
  }

  const c = data.counters;
  total = c ? c.precise : null; showPrecise();
  document.getElementById("c-agent").textContent = c ? c.per_agent : "-";
  document.getElementById("c-time").textContent = c ? c.time_based : "-";

  const twins = data.nodes.filter(n => n.twin_of).length;
  document.getElementById("banner").innerHTML =
    !data.nodes.length ? "empty graph - run <b>quarantine session1</b>"
    : !data.flagged ? "<b>Session 1</b> - crew writing memory, read sets recorded as edges"
    : twins === 0 ? `<b>Session 2</b> - advisory: <b>${esc(data.flagged)}</b> is prompt-injected`
    : `<b>Session 2</b> - healing: ${twins} memor${twins === 1 ? "y" : "ies"} rewritten from clean support`;
  if (nodes.length !== state.count) { state.count = nodes.length; net.fit({ animation: false }); }
  state.seen = true;
}

async function poll() {
  try {
    const r = await fetch("/graph");
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    render(data);
  } catch (e) {
    document.getElementById("banner").innerHTML = `<span id="err">graph unreachable: ${esc(e.message)}</span>`;
  }
}

function highlight(hops) {
  edges.forEach(e => edges.update({ id: e.id, color: { color: e.dashes && e.id.includes("SUPERSEDES") ? C.green : C.edge }, width: e.id.includes("SUPERSEDES") ? 2 : 1 }));
  if (!hops) return;
  for (let i = 0; i + 1 < hops.length; i++) {
    edges.get().filter(e => e.from === hops[i] && e.to === hops[i + 1])
      .forEach(e => edges.update({ id: e.id, color: { color: C.orange }, width: 4 }));
  }
}

net.on("click", async p => {
  const request = ++detailRequest;
  const detail = document.getElementById("detail");
  const id = p.nodes[0];
  if (!id) { highlight(null); detail.textContent = DETAIL_HINT; return; }
  const n = nodes.get(id);
  const isRed = state.red.has(id);
  if (!isRed) { highlight(null); detail.innerHTML = `<code>${esc(id)}</code> - ${esc(n.note || "")}`; return; }
  try {
    const res = await fetch("/receipt?id=" + encodeURIComponent(id));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rc = await res.json();
    if (request !== detailRequest) return;
    if (!rc || rc.shape !== "path") {                                   // not_in_graph / unknown: say which, in the guide's words
      detail.innerHTML = `<code>${esc(id)}</code>: <b>${esc(rc ? rc.shape : "no answer")}</b>. ${esc(rc && rc.answer ? rc.answer : "")}`;
      return;
    }
    highlight(rc.hops);
    const chain = rc.hops.map((h, i) => i ? ` <span class="path">-${esc(rc.via[i - 1])}-&gt;</span> ${esc(h)}` : esc(h)).join("");
    detail.innerHTML = `<code>${esc(id)}</code> is quarantined: ${esc(rc.len)} hops (shortestPath)<br><code>${chain}</code>`;
  } catch (err) {
    if (request !== detailRequest) return;
    detail.innerHTML = `<span id="err">receipt fetch failed: ${esc(err.message)}</span>`;
  }
});

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
